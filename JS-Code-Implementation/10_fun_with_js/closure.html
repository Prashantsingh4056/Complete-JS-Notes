<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Closure</title>
</head>

<body>

    <button id="orange">Orange</button>
    <button id="green">Green</button>

    <script>
        // function init() {

        //     let name = "Mozilla"; // name is a local variable created by init

        //     function displayName() {

        //         // displayName() is the inner function, that forms a closure

        //         console.log(name); // use variable declared in the parent function
        //     }

        //     displayName();
        // }
        // init();


        function outer() {
            let username = "Prashant"
            // console.log("outer", secret);  // Uncaught ReferenceError: secret is not defined


            function inner() {
                // let secret = "23452"
                console.log("inner", username);

            }

            function innerTwo() {
                console.log("innerTwo", username);
                // console.log(secret);    // closure.html:40 Uncaught ReferenceError: secret is not defined

            }

            inner()
            innerTwo()
        }

        outer();
        // console.log("too outer", username);


        // init() creates a local variable called name and a function called displayName().
        //  The displayName() function is an inner function that is defined inside init()
        //  and is available only within the body of the init() function. Note that the 
        // displayName() function has no local variables of its own. However, since inner 
        // functions have access to the variables of outer scopes, displayName() can access
        //  the variable name declared in the parent function, init().


        // ---------------------------- Closures ---------------------------------

        function makeFunc() {
            const name = "Mozilla";
            function displayName() {
                console.log(name);
            }
            return displayName;
        }

        const myFunc = makeFunc();
        myFunc();  // closure is when a whole function is returned , then not only the function is retuned but its whole lexical scope is returned  



    </script>
    <script>

        // Example of working of closures

        // document.getElementById("orange").onclick = function(){
        //     document.body.style.backgroundColor = "orange"
        // }

        // document.getElementById("green").onclick = function(){
        //     document.body.style.backgroundColor = "green"
        // }


        // function clickHandler(color){
        //     document.body.style.backgroundColor = `${color}`
        // }


        document.getElementById('orange').onClick = clickHandler("orange") // this will not work as intended 

        // we need to change function definition

        
        function clickHandler(color){
            
            

            return function(){

                document.body.style.backgroundColor = `${color}`
            }
        }


        document.getElementById('orange').onclick = clickHandler("orange")
        document.getElementById('green').onclick = clickHandler("green")
    </script>
</body>

</html>
